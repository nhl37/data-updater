# ==========================================================================
# 本机配置示例
#
# 复制成 config.properties 后按自己的机器改：
#     cp config.example.properties config.properties
#
# config.properties 是**本机文件**，不进版本库（见 .gitignore）：
# 它里面是绝对路径和本机口令，跟代码无关。
# 程序启动时读「程序目录 / config.properties」，找不到就用代码里的默认值。
# ==========================================================================

# ---------- 本地行情软件目录（盘后下载、除权、财报的数据来源）----------
# 通达信安装目录，末尾要带斜杠；也可以启动时用 --tdx-dir 覆盖
tdx.path=/path/to/tdx/
tdx.my_cloumn.data="T0002/signals/extern_user.txt"
tdx.my_cloumn.num=1

# 大智慧安装目录（备用除权来源）
dzh.path=/path/to/dzh/
dzh.dividend.path.sz.INFOEX=data/sz/
dzh.dividend.path.sh.INFOEX=data/SH/
dzh.dividend.path.PWR=Download/PWR/
dzh.dividend.file=SPLIT.PWR,full_sz.PWR
dzh.dividend.pre=sh6,sz3,sz0

# ---------- 数据落点（相对程序目录）----------
data.path=data/
data.path.db=data/db
data.path.dbbak=data/dbbak

# ---------- 代码段规则 ----------
stock.sh.start=6,sh
stock.sz.start=0,3,sz
stock.bj.start=89,9,bj

# ---------- 均线与图表 ----------
moving.average.close=3,5,10,14,20,28,56,100,112,224,448
moving.average.amo=5,10,14,20,28,56,100,112,224,448
chart.ma.close=5,10,20,60
chart.ma.colors=5:#E6E6E6,10:#FFD54F,20:#E573B5,60:#7ED6A5
chart.ma.width=5:1.4,10:1.4,20:1.4,60:1.4
chart.ma.style=5:SOLID,10:SOLID,20:SOLID,60:SOLID
chart.ma.volume=5,10
chart.ma.volume.colors=#FFD54F,#4FC3F7
chart.ma.volume.width=1.1
chart.ma.volume.style=SOLID
chart.volume.mode=VOL
chart.indicator.windows=2
chart.indicator.list=MACD,KDJ
chart.boll.enable=true
chart.boll.param=20,2
chart.boll.edge.color=#4FC3F7
chart.boll.edge.alpha=255
chart.boll.fill.color=#4FC3F7
chart.boll.fill.alpha=40
chart.candle.style=SOLID
chart.price.scale=100
chart.macd.param=12,26,9
chart.kdj.param=9,3,3
chart.periods=DAY,WEEK,MONTH
chart.bars=120
chart.area.price.weight=3.0
chart.area.volume.weight=1.0
chart.area.indicator.weight=1.15

# ---------- python 解释器与脚本（留空 = 启动时自动探测）----------
tdx.dividend.pythonExe=
tdx.dividend.pythonFile=python/read_tdx_gbbq.py
tdx.dividend.outputFile=data/tdx/tdx_xdxr.csv
tdx.dividend.filterCodes=false
tdx.dividend.debug=false
tdx.finance.pythonExe=
tdx.finance.pythonFile=python/read_tdx_finance.py
tdx.finance.downloadDir=data/tdx/finance_data
tdx.finance.csvFile=data/finance/tdx_finance.csv
tdx.finance.metaFile=data/finance/tdx_finance.meta
tdx.finance.dbDir=data
tdx.finance.dbName="finance"
tdx.finance.minValidSize=1024
tdx.finance.codePrefix=true
tdx.finance.debug=false
akshare.pythonExe=
akshare.capital.pythonFile=python/akshare_capital.py
akshare.capital.outFile=data/capital/akshare_capital.csv
akshare.capital.codesFile=data/capital/codes.txt
akshare.capital.threads=6
akshare.capital.maxCodes=300

# ---------- 并发与超时 ----------
factor.threads=0
updater.threads=0
updater.stock.timeout.seconds=120
updater.hang.enabled=true
updater.hang.softwarn.seconds=20
updater.progress.interval.seconds=3
updater.day.read.tail=true
log.flush.eachline=false
engine.mode=native
