# 数据更新程序专用混淆配置
# 关键点：
#   1) 业务类重打包到 u/
#   2) 用独立混淆字典
#   3) 不保留 LineNumberTable / SourceFile 等调试属性
#   4) keep 的入口与反射任务类全部是 updater.* 命名空间

-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.base.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.desktop.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.logging.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.sql.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.xml.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.naming.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.management.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.datatransfer.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.compiler.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.instrument.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/java.net.http.jmod(!**.jar;)
-libraryjars /usr/lib/jvm/java-17-openjdk-amd64/jmods/jdk.unsupported.jmod(!**.jar;)

-injars  @@BASE@@/target/updater-app.jar
-outjars @@BASE@@/target/updater-app-obf.jar
-libraryjars @@BASE@@/target/updater-lib.jar

-dontshrink
-dontoptimize
-dontwarn **

# 唯一入口（manifest 里写原名，不能被改）
-keep public class updater.main.updater.UpdaterMain { public static void main(java.lang.String[]); }

# 按类名字符串反射启动的任务类：字符串常量不会被 ProGuard 改写，类名必须保住
-keep class updater.main.down.MainDownLoadFromTdx { public static void main(java.lang.String[]); }
-keep class updater.main.old.search.MainSearchByUpdate { public static void main(java.lang.String[]); }
-keep class updater.fetchdata.tdx.min.MinDataUpdater { public static void main(java.lang.String[]); }
-keep class updater.mainwave.StockNameUpdater { public static void main(java.lang.String[]); }
-keep class updater.main.down.MainBackfillHistoryFromTdx { public static void main(java.lang.String[]); }
-keep class updater.main.down.MainDividendFromTdxLocal { public static void main(java.lang.String[]); }
-keep class updater.main.down.MainDividendFromDzh { public static void main(java.lang.String[]); }

# fastjson2 按字段名反序列化的数据类
-keepclassmembers class updater.f10.**,updater.finance.**,updater.fetchdata.**,updater.bean.** {
    <fields>;
}

-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions
-obfuscationdictionary @@BASE@@/obfuscation-dictionary.txt
-repackageclasses 'u'
-allowaccessmodification
